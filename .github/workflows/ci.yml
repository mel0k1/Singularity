name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: comment-free sources
        run: |
          bad=$(grep -rEn '^[[:space:]]*(//|/\*)' --include='*.rs' --include='*.cs' --exclude-dir=engine rust csharp 2>/dev/null || true)
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            exit 1
          fi

  fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --all

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release --all

  csharp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: cargo build --release -p singularity-physics-ffi
        working-directory: rust
      - run: cargo build --release -p singularity-net-transport
        working-directory: rust
      - run: dotnet build benches/Singularity.PhysicsBench -c Release
      - run: dotnet run --project benches/Singularity.PhysicsBench -c Release --no-build -- --scene=all --ticks=60 --validate
      - run: dotnet run --project benches/Singularity.PhysicsBench -c Release --no-build -- --scene=all --ticks=60 --validate --strict --backend=rapier
      - run: dotnet run --project benches/Singularity.PhysicsBench -c Release --no-build -- --scene=all --ticks=60 --verify-sync
      - run: dotnet test engine/Robust.Shared.IntegrationTests -c Release --filter "FullyQualifiedName~SgTransport|FullyQualifiedName~NetManagerRealPair"
