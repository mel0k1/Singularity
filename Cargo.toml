[workspace]
resolver = "2"
members = [
    "crates/singularity-core",
    "crates/singularity-server",
    "crates/singularity-client",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mel0k1/Singularity"

[workspace.dependencies]
singularity-core = { path = "crates/singularity-core" }
